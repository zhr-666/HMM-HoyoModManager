<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';">
  <title>原神热键</title>
  <link rel="stylesheet" href="hotkey-overlay.css">
</head>
<body>
  <main id="entry" class="entry" hidden>
    <div class="drag-handle" title="拖动悬浮窗">⠿</div>
    <button id="open" type="button" aria-label="打开角色热键"><span id="entry-role"></span><strong>热键</strong></button>
  </main>
  <main id="detail" class="detail" hidden>
    <header class="detail-head">
      <div><small>原神 · 已启用模组</small><h1 id="detail-role"></h1></div>
      <button id="close" type="button" aria-label="关闭热键窗口">×</button>
    </header>
    <div id="hotkey-list" class="hotkey-list"></div>
    <section class="settings" aria-label="悬浮窗设置">
      <h2>悬浮窗设置</h2>
      <label>入口大小 <output id="entry-size-value"></output><input id="entry-size" type="range" min="56" max="160" step="4"></label>
      <label>字体大小 <output id="font-size-value"></output><input id="font-size" type="range" min="12" max="32" step="1"></label>
      <p>拖动入口顶部的把手可调整位置。</p>
      <p id="settings-error" class="settings-error" role="alert" hidden></p>
    </section>
  </main>
  <script src="hotkey-overlay.js"></script>
</body>
</html>
